# Weekly dependency PRs, grouped so a refresh is one reviewable PR rather than twenty.
#
# Does NOT cover the tools we download by URL and pin by checksum (yt-dlp, deno) — dependabot has no
# ecosystem for those, which is why they have their own workflows.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch/minor together: they are the ones that should be boring to review.
      rust-minor:
        update-types: [minor, patch]
        # ort is version-pinned to an exact PRE-RELEASE (=2.0.0-rc.N). rc.10 -> rc.13 shares the
        # 2.0.0 prefix, so dependabot classifies it as a patch and drops it in here with the boring
        # ones — and it is never boring: rc.13 required a new TLS feature and broke three APIs, and
        # it moves the native ONNX Runtime by six minor versions, which changes the vectors (see
        # CLAUDE.md). Grouped with anything else, the whole group fails to build and sits open, which
        # is exactly what happened. On its own it is a PR someone reads.
        exclude-patterns: ["ort"]
      ort:
        patterns: ["ort"]
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
