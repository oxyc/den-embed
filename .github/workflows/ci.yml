name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # docker-publish.yml calls this as its gate, so a tag cannot publish an image CI would reject.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      # Denied, not reported. This is not style policing: a working tree once had the entire
      # shutdown path dead — `main` still called plain `axum::serve`, so SIGTERM was caught and
      # discarded and the process could only be killed with SIGKILL. Three clippy lines named it
      # (unused variable `shutdown`, variants never constructed, function never used) and nothing in
      # CI was running them.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Contract unit tests (quantize / cache-key / blank handling). ort downloads
      # ONNX Runtime during the build; the unit tests don't touch the model. The
      # end-to-end byte-parity gate (tests/parity_check.py) is run manually against
      # a live instance + golden vectors, not in CI.
      - name: Tests
        run: cargo test --locked

  # The image is what actually ships, and it builds differently from `cargo build` (debian trixie,
  # static ORT, a 555 MB model fetch). Catching a Dockerfile break on the PR rather than at `git tag`
  # time, without pushing, for amd64 — the only arch the box runs. A tag's publish job builds it anyway.
  build-pr:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
