name: ci

# Every exact main commit produces a scanned, immutable candidate image while its checks run. A release tag only
# promotes that already-tested digest (docker-publish.yml); it never recompiles or reruns this workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR revisions are disposable. A main SHA is a potential release and its candidate must finish even
  # when another merge follows it, otherwise a tag could name a commit whose exact image was cancelled midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/den-embed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      # Denied, not reported. This is not style policing: a working tree once had the entire
      # shutdown path dead — `main` still called plain `axum::serve`, so SIGTERM was caught and
      # discarded and the process could only be killed with SIGKILL. Three clippy lines named it
      # (unused variable `shutdown`, variants never constructed, function never used) and nothing in
      # CI was running them.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Contract unit tests (quantize / cache-key / blank handling). ort downloads
      # ONNX Runtime during the build; the unit tests don't touch the model. The
      # end-to-end byte-parity gate (tests/parity_check.py) is run manually against
      # a live instance + golden vectors, not in CI.
      - name: Tests
        run: cargo test --locked

  # The image is what actually ships, and it builds differently from `cargo build` (debian trixie,
  # static ORT, a 555 MB model fetch). A PR proves the same build graph main publishes, without pushing: it reads
  # main's cache but does not overwrite the durable release cache with an unmerged revision. Beside `test`, not
  # after it: the two are independent and the image build is the long pole.
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read release metadata
        id: source
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION is not X.Y.Z: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build the image
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          source: .
          files: docker-bake.hcl
          set: |
            *.args.DEN_VERSION=${{ steps.source.outputs.version }}
            *.args.GIT_REVISION=${{ github.sha }}
            *.output=type=cacheonly

  # Main builds and scans an immutable candidate while the test job runs. It is intentionally unsigned and never
  # receives :latest here; docker-publish promotes it only after this exact workflow has succeeded.
  candidate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # Trivy's report goes to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release metadata
        id: source
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION is not X.Y.Z: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build and push the candidate
        id: bake
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          source: .
          files: docker-bake.hcl
          push: true
          set: |
            *.args.DEN_VERSION=${{ steps.source.outputs.version }}
            *.args.GIT_REVISION=${{ github.sha }}
            image.tags=${{ env.IMAGE }}:candidate-${{ github.sha }}
            image.cache-to=type=gha,mode=max,scope=release-images
      - name: Record candidate digest
        id: images
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          image=$(jq -r '.image["containerimage.digest"] // empty' <<<"$METADATA")
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest in bake metadata"; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
      # Starts the very bytes that will ship: the model is baked in, so /embed must answer with 1024 dims, and the
      # service must report the VERSION file's release rather than the (fixed) Cargo.toml version.
      - name: Prove the image reports its release version and embeds
        env:
          DIGEST: ${{ steps.images.outputs.image }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST" >/dev/null
          id=$(docker run --rm -d -p 127.0.0.1:18080:8080 "$IMAGE@$DIGEST")
          trap 'docker logs "$id" 2>&1 | tail -20 || true; docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          body=""
          for _ in $(seq 1 60); do
            body=$(curl -fsS http://127.0.0.1:18080/health 2>/dev/null) && break
            sleep 1
          done
          got=$(jq -r .runtime <<<"$body")
          test "$got" = "den-embed/$VERSION" || { echo "::error::image /health runtime is $got, expected den-embed/$VERSION"; exit 1; }
          dims=$(curl -fsS -m 60 'http://127.0.0.1:18080/embed?text=a%20heist%20thriller' | jq -r '.vector | length')
          test "$dims" = 1024 || { echo "::error::/embed returned $dims dims, expected 1024"; exit 1; }
      # One scan of fixable HIGH and CRITICAL findings, which the report and the gate both read.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.images.outputs.image }}
          version: v0.74.0
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      # A CRITICAL with a fixed version available fails here, before a digest is recorded for promotion. Unfixed
      # CVEs are ignored. A finding that does not apply goes in .trivyignore with a reason.
      - name: Gate on fixable critical findings
        run: trivy convert --severity CRITICAL --exit-code 1 --format table trivy.json
      - name: Bind this CI run to its candidate digest
        env:
          IMAGE_DIGEST: ${{ steps.images.outputs.image }}
        run: |
          jq -n --arg image "$IMAGE_DIGEST" '{image: $image}' > candidate-digests.json
      - name: Save candidate identity for release promotion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate-digests.json
          if-no-files-found: error
          retention-days: 30
      # Report: advisory, it never fails the job.
      - name: Report for code scanning
        continue-on-error: true
        run: trivy convert --format sarif --output trivy.sarif trivy.json
      - name: Upload scan to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-image
