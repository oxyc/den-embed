name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Contract unit tests (quantize / cache-key / blank handling). ort downloads
      # ONNX Runtime during the build; the unit tests don't touch the model. The
      # end-to-end byte-parity gate (tests/parity_check.py) is run manually against
      # a live instance + golden vectors, not in CI.
      - run: cargo test --locked

  image:
    # Build + push the model-baked image ONLY on a v* tag (a deliberate release) or a manual run — NOT
    # every main push. Tests still run on push/PR; the box updates only when you cut a tag. Matches the
    # other addons.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
